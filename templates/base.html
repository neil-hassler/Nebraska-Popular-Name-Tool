<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Nebraska Statute Popular Names{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YcnS/1p8EfIMR+EVB2sFNyp9a3z0Bw7IARz"
        crossorigin="anonymous">
  <style>
    body {
      background-color: #fafaf8;
      color: #2c2c2c;
      font-family: Georgia, "Times New Roman", serif;
    }
    .navbar {
      background-color: #1a3a5c;
    }
    .navbar-brand, .nav-link {
      color: #e8e4dc !important;
    }
    .nav-link:hover {
      color: #fff !important;
    }
    .nav-link.active {
      font-weight: bold;
      color: #fff !important;
    }
    h1, h2, h3 {
      font-family: Georgia, "Times New Roman", serif;
    }
    .search-box {
      max-width: 640px;
      margin: 0 auto;
    }
    .result-card {
      border-left: 4px solid #1a3a5c;
      background: #fff;
    }
    .letter-nav a {
      display: inline-block;
      width: 2rem;
      text-align: center;
      margin: 0.1rem;
      text-decoration: none;
      font-weight: bold;
      color: #1a3a5c;
    }
    .letter-nav a:hover {
      text-decoration: underline;
    }
    .hero {
      background: linear-gradient(rgba(26, 58, 92, 0.72), rgba(26, 58, 92, 0.85)),
                  url('https://upload.wikimedia.org/wikipedia/commons/thumb/8/83/Nebraska_State_Capitol_from_W_1.JPG/1200px-Nebraska_State_Capitol_from_W_1.JPG');
      background-size: cover;
      background-position: center top;
      color: #fff;
      padding: 3rem 1rem 2.5rem;
    }
    .hero h1 {
      font-size: 2.2rem;
      font-weight: 700;
      text-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }
    .hero p {
      color: #ddd;
    }
    .quick-jump {
      max-width: 480px;
      margin: 0 auto;
    }
    .quick-jump select {
      font-family: Georgia, "Times New Roman", serif;
      border: 2px solid #1a3a5c;
      cursor: pointer;
    }
    .popular-tags a {
      display: inline-block;
      padding: 0.3rem 0.75rem;
      margin: 0.25rem;
      border: 1px solid #1a3a5c;
      border-radius: 999px;
      font-size: 0.85rem;
      text-decoration: none;
      color: #1a3a5c;
      transition: all 0.15s;
    }
    .popular-tags a:hover {
      background-color: #1a3a5c;
      color: #fff;
    }
    .view-toggle .btn {
      font-size: 0.85rem;
    }
    .view-toggle .btn.active {
      background-color: #1a3a5c;
      border-color: #1a3a5c;
      color: #fff;
    }

    /* Browse page layout with Jump-to sidebar */
    .browse-layout {
      display: flex;
      gap: 1rem;
    }
    .browse-main {
      flex: 1;
      min-width: 0;
    }
    .jump-to-sidebar {
      position: sticky;
      top: 1rem;
      align-self: flex-start;
      text-align: center;
      padding: 0.5rem 0.25rem;
      line-height: 1.1;
    }
    .jump-to-sidebar .jump-label {
      font-weight: bold;
      font-size: 0.8rem;
      color: #555;
      margin-bottom: 0.25rem;
    }
    .jump-to-sidebar a {
      display: block;
      padding: 1px 0.4rem;
      font-size: 0.85rem;
      font-weight: bold;
      color: #5a1a1a;
      text-decoration: none;
    }
    .jump-to-sidebar a:hover {
      text-decoration: underline;
      color: #1a3a5c;
    }

    /* Simple text-based statute entries */
    .statute-entry {
      margin-bottom: 0.6rem;
    }
    .statute-entry .entry-name {
      font-weight: bold;
      color: #2c2c2c;
    }
    .statute-entry .entry-name a {
      color: #2c2c2c;
      text-decoration: none;
    }
    .statute-entry .entry-name a:hover {
      text-decoration: underline;
      color: #1a3a5c;
    }
    .statute-entry .entry-details {
      padding-left: 2rem;
      color: #555;
      font-size: 0.92rem;
    }

    footer {
      border-top: 1px solid #ddd;
      color: #777;
      font-size: 0.85rem;
    }
    a {
      color: #1a3a5c;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-md mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">NE Statute Names</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navContent" aria-controls="navContent"
            aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navContent">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'home' %}active{% endif %}" href="/">Search</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'browse' %}active{% endif %}" href="/browse">Browse</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'about' %}active{% endif %}" href="/about">About</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main class="container mb-5">
  {% block content %}{% endblock %}
</main>

<footer class="container text-center py-3">
  <p>Nebraska Statute Popular Name Index &middot; Built from public data &middot;
     <a href="/about">About this project</a></p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
