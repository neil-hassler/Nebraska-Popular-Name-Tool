<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Nebraska Statute Popular Names{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YcnS/1p8EfIMR+EVB2sFNyp9a3z0Bw7IARz"
        crossorigin="anonymous">
  <style>
    body {
      background-color: #fafaf8;
      color: #2c2c2c;
      font-family: Georgia, "Times New Roman", serif;
    }
    .navbar {
      background-color: #1a3a5c;
    }
    .navbar-brand, .nav-link {
      color: #e8e4dc !important;
    }
    .nav-link:hover {
      color: #fff !important;
    }
    .nav-link.active {
      font-weight: bold;
      color: #fff !important;
    }
    h1, h2, h3 {
      font-family: Georgia, "Times New Roman", serif;
    }
    .search-box {
      max-width: 640px;
      margin: 0 auto;
    }
    .result-card {
      border-left: 4px solid #1a3a5c;
      background: #fff;
    }
    .letter-nav a {
      display: inline-block;
      width: 2rem;
      text-align: center;
      margin: 0.1rem;
      text-decoration: none;
      font-weight: bold;
      color: #1a3a5c;
    }
    .letter-nav a:hover {
      text-decoration: underline;
    }
    footer {
      border-top: 1px solid #ddd;
      color: #777;
      font-size: 0.85rem;
    }
    a {
      color: #1a3a5c;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-md mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">NE Statute Names</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navContent" aria-controls="navContent"
            aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navContent">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'home' %}active{% endif %}" href="/">Search</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'browse' %}active{% endif %}" href="/browse">Browse</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'about' %}active{% endif %}" href="/about">About</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main class="container mb-5">
  {% block content %}{% endblock %}
</main>

<footer class="container text-center py-3">
  <p>Nebraska Statute Popular Name Index &middot; Built from public data &middot;
     <a href="/about">About this project</a></p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
